name: PB40 max1000 block-fresh refresh

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pb40-public-feed-100.yml'
  schedule:
    - cron: '27 * * * *'
    - cron: '32 * * * *'
    - cron: '37 * * * *'

permissions:
  contents: write

concurrency:
  group: pb40-public-feed-100
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exactly one fresh fixed-block snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime runtime/archive

          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('Europe/Dublin'))
          start = now.replace(minute=0, second=0, microsecond=0) + timedelta(hours=1)
          end = start + timedelta(minutes=45)
          print(f'Expected PB40 block: {start.isoformat()} -> {end.isoformat()}')
          open('/tmp/pb40_target_start','w').write(start.isoformat())
          open('/tmp/pb40_target_end','w').write(end.isoformat())
          PY

          BASE='https://pronosticibomba-pb40.onrender.com'
          curl -fsS --retry 2 --retry-all-errors --retry-delay 3 \
            --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Pragma: no-cache' \
            "$BASE/health?_=$(date +%s%N)" >/dev/null || true

          rm -f runtime/pb40_candidate.json
          VALID=0

          for attempt in 1 2 3; do
            cb="$(date +%s%N)-${attempt}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "PB40 fetch attempt ${attempt}/3"

            if curl -fsS --retry 1 --retry-all-errors --retry-delay 4 \
              --connect-timeout 15 --max-time 210 \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$BASE/pb40?max=1000&force=1&_=${cb}" \
              -o runtime/pb40_candidate.json; then

              if python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          dublin = ZoneInfo('Europe/Dublin')
          start = datetime.fromisoformat(open('/tmp/pb40_target_start').read().strip())
          end = datetime.fromisoformat(open('/tmp/pb40_target_end').read().strip())
          now = datetime.now(dublin)

          with open('runtime/pb40_candidate.json', encoding='utf-8') as fh:
              p = json.load(fh)

          if p.get('ok') is not True:
              raise SystemExit('payload ok != true')
          if not isinstance(p.get('matches'), list):
              raise SystemExit('matches is not a list')
          if p.get('block_verified') is not True:
              raise SystemExit('block_verified != true')
          if p.get('analysis_truncated') is True:
              raise SystemExit('analysis_truncated == true')

          generated_raw = p.get('generated_at_dublin')
          if not generated_raw:
              raise SystemExit('missing generated_at_dublin')
          generated = datetime.fromisoformat(generated_raw.replace('Z', '+00:00')).astimezone(dublin)
          age = (now - generated).total_seconds()
          if age < -120 or age > 8 * 60:
              raise SystemExit(f'stale/future payload age_seconds={age:.1f}')

          payload_start = datetime.fromisoformat(str(p.get('target_block_start_dublin')).replace('Z', '+00:00')).astimezone(dublin)
          payload_end = datetime.fromisoformat(str(p.get('target_block_end_dublin')).replace('Z', '+00:00')).astimezone(dublin)
          if payload_start != start or payload_end != end:
              raise SystemExit(
                  f'wrong block payload={payload_start.isoformat()}->{payload_end.isoformat()} '
                  f'expected={start.isoformat()}->{end.isoformat()}'
              )

          target_count = int(p.get('target_block_matches') or 0)
          relevant_count = int(p.get('relevant_fixtures_in_target_block') or 0)
          analysed_count = int(p.get('fixtures_analyzed_before_ranking') or 0)
          returned_count = len(p['matches'])

          if target_count <= 1000 and returned_count != target_count:
              raise SystemExit(f'incomplete returned block matches={returned_count}/{target_count}')
          if relevant_count <= 1000 and analysed_count != relevant_count:
              raise SystemExit(f'incomplete relevant analysis={analysed_count}/{relevant_count}')

          seen = set()
          for m in p['matches']:
              fid = str(m.get('fixture_id') or '').strip()
              if not fid:
                  raise SystemExit('match without fixture_id')
              if fid in seen:
                  raise SystemExit(f'duplicate fixture_id={fid}')
              seen.add(fid)
              raw = m.get('kickoff_dublin')
              if not raw:
                  raise SystemExit(f'missing kickoff fixture_id={fid}')
              ko = datetime.fromisoformat(raw.replace('Z', '+00:00')).astimezone(dublin)
              if not (start <= ko <= end):
                  raise SystemExit(f'fixture outside block fixture_id={fid} ko={ko.isoformat()}')

          print(
              f'VALID fresh block: target={target_count}, relevant={relevant_count}, '
              f'analysed={analysed_count}, returned={returned_count}, age={age:.1f}s'
          )
          PY
              then
                VALID=1
                break
              fi
            fi

            rm -f runtime/pb40_candidate.json
            if [ "$attempt" -lt 3 ]; then sleep 12; fi
          done

          if [ "$VALID" -ne 1 ] || [ ! -f runtime/pb40_candidate.json ]; then
            echo 'Could not obtain a fresh, exact PB40 block snapshot.' >&2
            exit 1
          fi

          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = 'runtime/pb40_candidate.json'
          with open(path, encoding='utf-8') as fh:
              p = json.load(fh)

          dublin = ZoneInfo('Europe/Dublin')
          start = datetime.fromisoformat(open('/tmp/pb40_target_start').read().strip())
          end = datetime.fromisoformat(open('/tmp/pb40_target_end').read().strip())

          p['public_feed'] = {
              'repository': 'chinoknot/pronosticibombapp',
              'refreshed_by': 'pb40-public-feed-1000-block-fresh',
              'source_url': 'Render /pb40?max=1000&force=1',
              'target_block_start_dublin': start.isoformat(),
              'target_block_end_dublin': end.isoformat(),
              'target_block_matches': int(p.get('target_block_matches') or 0),
              'relevant_fixtures_in_target_block': int(p.get('relevant_fixtures_in_target_block') or 0),
              'block_verified': True,
              'fallback_used': False,
              'freshness_limit_seconds': 480,
              'complete_block_required': True,
          }

          for m in p.get('matches', []):
              positive = [x for x in (m.get('value_markets') or []) if float(x.get('edge') or 0) > 0]
              positive.sort(key=lambda x: float(x.get('edge') or 0), reverse=True)
              m['value_markets'] = positive
              m['best_value_market'] = positive[0] if positive else None

          with open('runtime/pb40_latest.json', 'w', encoding='utf-8') as fh:
              json.dump(p, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          PY

          rm -f runtime/pb40_candidate.json

          jq '
            def reason:
              if .actionable_candidate == true then
                if ((.pb_picks // []) | length) > 0 then "PB editorial pick"
                elif ((.best_value_market.edge // 0) >= 0.02) then "Positive model edge >= 2%"
                else "Actionable by ranker" end
              elif ((.live_odds.bookmaker // "") == "") then "No bookmaker odds"
              elif ((.value_markets // []) | length) == 0 then "No positive value market"
              elif ((.best_value_market.edge // 0) < 0.02) then "Positive edge below actionable threshold"
              else "Below actionable ranking threshold" end;
            def compact_match:
              {fixture_id,kickoff_dublin,minutes_to_kickoff,timing_priority,league,country,home,away,
               bookmaker:(.live_odds.bookmaker // ""),live_odds,best_value_market,value_markets,pb_metrics,
               api_prediction,pb_raw_available,pb_picks,rank_score,actionable_candidate,selection_reason:reason,
               exclusion_reason,live_enrichment};
            {ok,source,generated_at_dublin,match_date,selection_window,
             target_block_start_dublin,target_block_end_dublin,target_block_matches,block_verified,
             fixtures_today_total,fixtures_target_date_total,fixtures_in_next_75m,relevant_fixtures_in_next_75m,
             fixtures_in_target_block,relevant_fixtures_in_target_block,excluded_in_target_block,excluded_breakdown,
             fixtures_analyzed_before_ranking,analysis_truncated,analysis_hard_cap,technical_coverage_count,
             odds_coverage_count,actionable_candidates_found,matches_returned,max_is_return_limit_only,
             max_return_limit,partial_api_errors,api_rate_limit,public_feed,
             top_actionable:[.matches[]|select(.actionable_candidate==true)|compact_match],
             technical_fallbacks:[.matches[]|select(.actionable_candidate!=true and ((.exclusion_reason // "") == ""))|compact_match],
             excluded_matches:[.matches[]|select((.exclusion_reason // "") != "")|compact_match],
             all_ranked:[.matches[]|compact_match]}
          ' runtime/pb40_latest.json > runtime/pb40_compact.json

          cp runtime/pb40_latest.json "runtime/archive/pb40-$(date -u +%Y%m%d-%H%M%S).json"
          find runtime/archive -type f -name 'pb40-*.json' -printf '%T@ %p\n' | sort -nr | tail -n +49 | cut -d' ' -f2- | xargs -r rm -f

          jq -n \
            --arg refreshed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg generated_at "$(jq -r '.generated_at_dublin' runtime/pb40_latest.json)" \
            --arg block_start "$(jq -r '.target_block_start_dublin' runtime/pb40_latest.json)" \
            --arg block_end "$(jq -r '.target_block_end_dublin' runtime/pb40_latest.json)" \
            --argjson block_matches "$(jq '.target_block_matches' runtime/pb40_latest.json)" \
            --argjson relevant_matches "$(jq '.relevant_fixtures_in_target_block' runtime/pb40_latest.json)" \
            --argjson analysed_matches "$(jq '.fixtures_analyzed_before_ranking' runtime/pb40_latest.json)" \
            --argjson block_verified "$(jq '.block_verified' runtime/pb40_latest.json)" \
            --argjson analysis_truncated "$(jq '.analysis_truncated' runtime/pb40_latest.json)" \
            '{ok:true,refreshed_at_utc:$refreshed_at,source_generated_at_dublin:$generated_at,max:1000,
              target_block_start_dublin:$block_start,target_block_end_dublin:$block_end,
              target_block_matches:$block_matches,relevant_fixtures_in_target_block:$relevant_matches,
              fixtures_analyzed_before_ranking:$analysed_matches,block_verified:$block_verified,
              analysis_truncated:$analysis_truncated,fallback_used:false,
              freshness_limit_seconds:480,complete_block_required:true}' \
            > runtime/pb40_status.json

      - name: Commit canonical block-fresh feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pb40-public-feed-bot'
          git config user.email 'actions@users.noreply.github.com'

          snapshot="${RUNNER_TEMP}/pb40-public-feed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$snapshot"
          mkdir -p "$snapshot/runtime"
          cp runtime/pb40_latest.json "$snapshot/runtime/pb40_latest.json"
          cp runtime/pb40_compact.json "$snapshot/runtime/pb40_compact.json"
          cp runtime/pb40_status.json "$snapshot/runtime/pb40_status.json"
          newest_archive="$(find runtime/archive -maxdepth 1 -type f -name 'pb40-*.json' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$newest_archive" ]; then
            echo 'Fresh archive file missing.' >&2
            exit 1
          fi
          archive_name="$(basename "$newest_archive")"
          cp "$newest_archive" "$snapshot/$archive_name"
          snapshot_generated="$(jq -r '.generated_at_dublin' "$snapshot/runtime/pb40_latest.json")"

          for attempt in 1 2 3 4; do
            echo "PB40 race-safe publish attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            origin_generated=""
            if [ -f runtime/pb40_latest.json ]; then
              origin_generated="$(jq -r '.generated_at_dublin // empty' runtime/pb40_latest.json 2>/dev/null || true)"
            fi

            if [ -n "$origin_generated" ]; then
              if python - "$origin_generated" "$snapshot_generated" <<'PY'
          import sys
          from datetime import datetime

          origin = datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00'))
          candidate = datetime.fromisoformat(sys.argv[2].replace('Z', '+00:00'))
          raise SystemExit(0 if origin >= candidate else 1)
          PY
              then
                echo "Origin already has same/newer PB40 snapshot (${origin_generated}); nothing to publish."
                exit 0
              fi
            fi

            mkdir -p runtime/archive
            cp "$snapshot/runtime/pb40_latest.json" runtime/pb40_latest.json
            cp "$snapshot/runtime/pb40_compact.json" runtime/pb40_compact.json
            cp "$snapshot/runtime/pb40_status.json" runtime/pb40_status.json
            cp "$snapshot/$archive_name" "runtime/archive/$archive_name"

            find runtime/archive -type f -name 'pb40-*.json' -printf '%T@ %p\n' | sort -nr | tail -n +49 | cut -d' ' -f2- | xargs -r rm -f

            git add runtime/pb40_latest.json runtime/pb40_compact.json runtime/pb40_status.json runtime/archive
            if git diff --cached --quiet; then
              echo 'Canonical PB40 feed already current.'
              exit 0
            fi

            git commit -m 'Refresh PB40 block-fresh feed'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race on attempt ${attempt}/4; retrying from latest origin without rebase."
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 3)); fi
          done

          echo 'Unable to publish PB40 block-fresh feed after race-safe retries.' >&2
          exit 1
